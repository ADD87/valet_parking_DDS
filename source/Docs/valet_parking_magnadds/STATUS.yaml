  description: 已按 runner/component/adapter 分层接入 SelectedSlot -> ROI_DECIDER -> PATH_PROVIDER -> PATH_PARTITION -> SPEED_OPTIMIZER -> PlanningTrajectory。PATH_PROVIDER 当前仍使用 standalone 中已独立化的 OpenSpacePathGenerator + HybridAStar + PathPartition 粗路径链路；NEXT-018 已接入轻量运行态复用与 replan 标记；NEXT-019 继续对照完整 OpenSpacePathProvider 的 SetWarmStartPath/SetPathStrategy 思路，在 adapter 中新增不依赖完整 Frame/DependencyInjector 的历史路径 warm_start 构造、轻量策略字段和状态日志。当前策略切片会在同目标、同障碍物、历史路径可用且仅 TRACE_REPLAN 的保守条件下，从上一帧路径截取 warm_start；障碍物变化、目标变化、速度重规划或碰撞风险时不把旧路径作为 fallback。日志新增 warm_start、warm_start_points、splice_points、strategy_init_move、strategy_kappa_cost、strategy_limit_steer 等字段。PATH_PARTITION 当前使用 standalone 中已独立化的 OpenSpacePathPartition::Execute 做任务级路径仲裁并输出 chosen_partitioned_path；SPEED_OPTIMIZER 当前使用 standalone 中已独立化的 OpenSpaceSpeedOptimizer::Execute 生成速度和时间采样。当前仍使用临时 IDL 契约和简化 Topic，仍未接完整 OpenSpacePathProvider 大类线程、完整 PreCheck、NLP smoother、完整 Frame/DependencyInjector 和真实车端板端闭环。x86 已完成 DDS 本机 smoke，m57 已完成 AArch64 交叉编译、ELF 和 MagnaDDS 依赖检查，板端 runtime 尚未验证。

