  id: Fast-2
  name: .so + typed DDS + ROI_DECIDER/PATH_PROVIDER/PATH_PARTITION/SPEED_OPTIMIZER light PreCheck slice
  status: PASS_PATH_PROVIDER_PRECHECK_SLICE_X86_M57_STATIC_BLOCKED_BOARD
  description: 已按 runner/component/adapter 分层接入 SelectedSlot -> ROI_DECIDER -> PATH_PROVIDER -> PATH_PARTITION -> SPEED_OPTIMIZER -> PlanningTrajectory。PATH_PROVIDER 当前仍使用 standalone 中已独立化的 OpenSpacePathGenerator + HybridAStar + PathPartition 粗路径链路；NEXT-018 已接入轻量运行态复用与 replan 标记；NEXT-019 对照完整 OpenSpacePathProvider 的 SetWarmStartPath/SetPathStrategy 思路新增历史路径 warm_start 构造、轻量策略字段和状态日志；NEXT-020 新增可控 moving-localization mock/smoke，并把 warm_start 截尾从依赖历史点 PathPoint.s 修订为基于历史路径 x/y 的几何累计距离投影；NEXT-021 新增轻量 PATH_PROVIDER_PRECHECK 切片，检查 ROI origin、xy_bounds、start/end pose、目标区域 polygon/角度和障碍物线段几何，并在状态日志输出 PATH_PROVIDER_PRECHECK ok；同时新增 vehicle_lot_precheck，在外部定位与选中车位几何明显不在同一局部 envelope 时于 ROI_DECIDER 前输出 estop，避免远定位样本触发 ROI 崩溃。当前策略切片会在同目标、同障碍物、历史路径可用且仅 TRACE_REPLAN 的保守条件下，从上一帧路径截取 warm_start；障碍物变化、目标变化、速度重规划或碰撞风险时不把旧路径作为 fallback。moving-localization smoke 已直接验证第二帧 replan=TRACE_REPLAN、warm_start=history_splice、warm_start_points>0、strategy_kappa_cost=true。当前仍使用临时 IDL 契约和简化 Topic，仍未接完整 OpenSpacePathProvider 大类线程、完整 PreCheck、NLP smoother、完整 Frame/DependencyInjector 和真实车端板端闭环。x86 已完成 DDS 本机 smoke，m57 已完成 AArch64 交叉编译、ELF 和 MagnaDDS 依赖检查，板端 runtime 尚未验证。

