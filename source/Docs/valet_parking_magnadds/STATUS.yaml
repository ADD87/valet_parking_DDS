current_phase:
  id: Fast-2
  name: .so + typed DDS + ROI_DECIDER/PATH_PROVIDER/PATH_PARTITION/SPEED_OPTIMIZER 辅助输入异常与局部输入边界硬化
  status: PASS_DDS_AUX_INPUT_HARDENING_X86_M57_STATIC_BLOCKED_BOARD
  description: 已按 runner/component/adapter 分层接入 SelectedSlot -> ROI_DECIDER -> PATH_PROVIDER -> PATH_PARTITION -> SPEED_OPTIMIZER -> PlanningTrajectory。PATH_PROVIDER 当前使用 standalone 中已独立化的 OpenSpacePathGenerator + HybridAStar + PathPartition 粗路径链路；PATH_PARTITION 当前使用 standalone 中已独立化的 OpenSpacePathPartition::Execute 做任务级路径仲裁并输出 chosen_partitioned_path；SPEED_OPTIMIZER 当前使用 standalone 中已独立化的 OpenSpaceSpeedOptimizer::Execute 生成速度和时间采样。adapter 已新增最小 runtime context，复用 PATH_PARTITION/SPEED_OPTIMIZER 对象，并新增可选 C API 外部输入边界。当前已在临时 IDL 契约中新增 LocalizationEstimate、ChassisState、ObstacleArray，并由 ValetParkingComponent 默认订阅 /localization/estimate、/chassis/state、/perception/obstacles，将样本转入 014 的外部输入边界。NEXT-017 已完成辅助输入异常与局部输入边界硬化：invalid/nan localization 会清理外部车辆状态，invalid chassis 会清理速度/加速度/档位，invalid obstacle array 或非法障碍物几何会清空外部障碍物；chassis-only 不会误置 external_vehicle=true；runner 可通过 --disable-aux-input-topics 关闭辅助 Topic。x86 已完成 all-valid、invalid-localization、nan-localization、chassis-only、invalid-obstacles、bad-obstacle-geometry、disable aux smoke；m57 已完成 AArch64 交叉编译、ELF 和 MagnaDDS 依赖检查。当前仍未对齐真实车端 Topic 契约，未接完整 OpenSpacePathProvider 大类、NLP smoother 和真实车端板端闭环，板端 runtime 尚未验证。

